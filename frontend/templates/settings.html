<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – CodeTrace</title>
  <meta name="description" content="Manage your CodeTrace profile and account security settings." />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>

<div class="app-shell">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <header class="top-bar">
      <span class="top-bar-title">Settings</span>
    </header>

    <main class="page-body">
      <div class="page-header">
        <h1>Settings</h1>
        <p class="subtitle">Manage your profile and account security</p>
      </div>

      <div class="settings-layout">

        <!-- Profile Card -->
        <div class="settings-card">
          <h2>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            Profile
          </h2>
          <p class="desc">Update your display name and email address</p>

          <!-- Success/Error messages -->
          <div id="profile-success" class="alert alert-success" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Profile updated successfully.
          </div>
          <div id="profile-error" class="alert alert-danger" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="profile-error-text"></span>
          </div>

          <form id="profile-form" novalidate>
            <div class="form-group">
              <label for="profile-username">Username</label>
              <input type="text" id="profile-username" class="form-control" placeholder="Enter username" />
            </div>
            <div class="form-group">
              <label for="profile-email">Email Address</label>
              <input type="email" id="profile-email" class="form-control" placeholder="Enter email address" />
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px;">
              <button type="button" class="btn btn-outline" id="edit-profile-btn">Edit Profile</button>
              <button type="submit" class="btn btn-primary" id="save-profile-btn">Save Changes</button>
            </div>
          </form>
        </div>

        <!-- Security Card -->
        <div class="settings-card">
          <h2>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Security
          </h2>
          <p class="desc">Change your account password</p>

          <div id="security-success" class="alert alert-success" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Password changed successfully.
          </div>
          <div id="security-error" class="alert alert-danger" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="security-error-text"></span>
          </div>

          <form id="security-form" novalidate>
            <div class="form-group">
              <label for="current-pw">Current Password</label>
              <div class="input-group">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="current-pw" class="form-control" placeholder="Enter current password" />
              </div>
            </div>
            <div class="form-group">
              <label for="new-pw">New Password</label>
              <div class="input-group">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="new-pw" class="form-control" placeholder="Enter new password (min 6 chars)" />
              </div>
            </div>
            <div class="form-group">
              <label for="confirm-pw">Confirm New Password</label>
              <div class="input-group">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="confirm-pw" class="form-control" placeholder="Confirm new password" />
              </div>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:4px;">
              <button type="submit" class="btn btn-primary" id="change-pw-btn">Change Password</button>
            </div>
          </form>
        </div>

      </div><!-- /settings-layout -->
    </main>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
  if (!Auth.requireAuth()) { /* stopped */ }
  Sidebar.render('settings');

  // ── Load profile ──────────────────────────────────────────────
  const user = Auth.getCurrentUser();
  const usernameField = document.getElementById('profile-username');
  const emailField    = document.getElementById('profile-email');

  usernameField.value = user ? user.username : '';
  emailField.value    = user ? user.email    : '';
  usernameField.disabled = true;
  emailField.disabled    = true;

  // ── Edit / Save Profile ───────────────────────────────────────
  document.getElementById('edit-profile-btn').addEventListener('click', () => {
    usernameField.disabled = false;
    emailField.disabled    = false;
    usernameField.focus();
    document.getElementById('profile-success').style.display = 'none';
    document.getElementById('profile-error').style.display   = 'none';
  });

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newUsername = usernameField.value.trim();
    const newEmail    = emailField.value.trim();
    const errDiv      = document.getElementById('profile-error');
    const errText     = document.getElementById('profile-error-text');
    const successDiv  = document.getElementById('profile-success');
    const saveBtn     = document.getElementById('save-profile-btn');

    if (!newUsername) {
      errText.textContent = 'Username cannot be empty.';
      errDiv.style.display = 'flex';
      successDiv.style.display = 'none';
      return;
    }
    if (!newEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) {
      errText.textContent = 'Please enter a valid email address.';
      errDiv.style.display = 'flex';
      successDiv.style.display = 'none';
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    try {
      await API.updateProfile(newUsername, newEmail);
      successDiv.style.display = 'flex';
      errDiv.style.display     = 'none';
      usernameField.disabled   = true;
      emailField.disabled      = true;
    } catch (err) {
      errText.textContent  = err.message;
      errDiv.style.display = 'flex';
      successDiv.style.display = 'none';
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';
    }
  });

  // ── Change Password ───────────────────────────────────────────
  document.getElementById('security-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const currentPw  = document.getElementById('current-pw').value;
    const newPw      = document.getElementById('new-pw').value;
    const confirmPw  = document.getElementById('confirm-pw').value;
    const errDiv     = document.getElementById('security-error');
    const errText    = document.getElementById('security-error-text');
    const successDiv = document.getElementById('security-success');
    const pwBtn      = document.getElementById('change-pw-btn');

    errDiv.style.display     = 'none';
    successDiv.style.display = 'none';

    if (!currentPw) {
      errText.textContent  = 'Please enter your current password.';
      errDiv.style.display = 'flex'; return;
    }
    if (!newPw || newPw.length < 6) {
      errText.textContent  = 'New password must be at least 6 characters.';
      errDiv.style.display = 'flex'; return;
    }
    if (newPw !== confirmPw) {
      errText.textContent  = 'New passwords do not match.';
      errDiv.style.display = 'flex'; return;
    }

    pwBtn.disabled = true;
    pwBtn.textContent = 'Changing…';
    try {
      await API.changePassword(currentPw, newPw);
      successDiv.style.display = 'flex';
      document.getElementById('current-pw').value  = '';
      document.getElementById('new-pw').value      = '';
      document.getElementById('confirm-pw').value  = '';
    } catch (err) {
      errText.textContent  = err.message;
      errDiv.style.display = 'flex';
    } finally {
      pwBtn.disabled = false;
      pwBtn.textContent = 'Change Password';
    }
  });

  // Clear errors on input
  ['current-pw','new-pw','confirm-pw'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById('security-error').style.display = 'none';
    });
  });
</script>
</body>
</html>
