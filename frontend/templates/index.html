<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – CodeTrace</title>
  <meta name="description" content="Sign in to CodeTrace, the AST-based code and notes duplicate detector."/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"/>
</head>
<body>

<div class="login-page">
  <div class="login-container">

    <div class="login-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
      </div>
      <h1>CodeTrace</h1>
      <p>AST-Based Code &amp; Notes Duplicate Detector</p>
    </div>

    <div class="login-card">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to your CodeTrace account</p>

      <div id="login-error" class="alert alert-danger" style="display:none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-username">Username</label>
          <div class="input-group">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input class="form-control" type="text" id="login-username"
                   placeholder="Enter your username" autocomplete="username" required/>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-group">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input class="form-control" type="password" id="login-password"
                   placeholder="Enter your password" autocomplete="current-password" required/>
          </div>
        </div>

        <button class="btn btn-primary btn-lg" type="submit" id="login-btn" style="margin-top:6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In
        </button>
      </form>

      <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border-light);
                  text-align:center;font-size:.78rem;color:var(--text-3);">
        Default credentials: <strong style="color:var(--text-2);">admin</strong> /
        <strong style="color:var(--text-2);">admin123</strong>
      </div>
    </div>

  </div>
</div>

<!-- auth.js provides Auth object; api.js extends it with backend support -->
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
  // ── Already logged in? Redirect to dashboard ──────────────
  // Only redirect if we have a valid session token. This check runs
  // AFTER both auth.js and api.js are loaded, so Auth.getSession()
  // reads ct_api_token (set by a real or local login).
  (function checkExistingSession() {
    const session = Auth.getSession();
    if (session) {
      window.location.href = 'dashboard.html';
    }
  })();

  // ── Login form handler ────────────────────────────────────
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const errorEl  = document.getElementById('login-error');
    const btn      = document.getElementById('login-btn');
    errorEl.style.display = 'none';

    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    // Basic client-side validation
    if (!username || !password) {
      showError('Please enter both username and password.');
      return;
    }

    // Disable button and show spinner while authenticating
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Signing in&hellip;`;

    try {
      // Auth.login is now async (api.js patches it to try backend first,
      // then falls back to local credentials if backend is offline).
      const result = await Auth.login(username, password);

      if (result.ok) {
        // Success — navigate away
        window.location.href = 'dashboard.html';
      } else {
        resetBtn();
        showError(result.error || 'Invalid username or password.');
      }
    } catch (err) {
      resetBtn();
      showError(err.message || 'Login failed. Please try again.');
    }
  });

  function resetBtn() {
    const btn = document.getElementById('login-btn');
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
      <polyline points="10 17 15 12 10 7"/>
      <line x1="15" y1="12" x2="3" y2="12"/>
    </svg> Sign In`;
  }

  function showError(msg) {
    const errorEl = document.getElementById('login-error');
    errorEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" style="width:15px;height:15px;flex-shrink:0">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg> ${msg}`;
    errorEl.style.display = 'flex';
  }
</script>
</body>
</html>
